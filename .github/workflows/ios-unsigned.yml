#
# Builds an UNSIGNED OneXray iOS IPA for personal sideloading
# (Sideloadly/AltStore/Xcode manual signing). No Apple secrets required.
#
# Mirrors the core build of .github/workflows/build.yml but replaces the
# signed fastlane deploy with `flutter build ipa --no-codesign` and packs
# the archive into an unsigned Payload IPA.
#
name: iOS unsigned

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

env:
  LIBXRAY_REF: main
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  ios-unsigned:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: OneXray
    steps:
      - uses: actions/checkout@v7
        with:
          path: OneXray

      - uses: actions/checkout@v7
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libXray

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: libXray/go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.x"
          enable-cache: false

      - name: Setup Flutter
        uses: ./OneXray/.github/actions/setup-flutter

      - name: Prepare project and build libXray core
        # Same sequence as app/flutter.py build() for iOS, stopping before
        # the signed fastlane step (AppleBuilder.build_app).
        run: |
          set -o pipefail
          uv run --project build_scripts python build_scripts/prepare_unsigned_ios.py 2>&1 | tee prepare.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 prepare.log >> "$GITHUB_STEP_SUMMARY" || true
            grep -Ei 'error|failed|fatal' prepare.log | head -15 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-160)"
            done || true
            exit "$status"
          fi

      - name: Build unsigned IPA
        env:
          MOD_TOTP_SECRET: ${{ secrets.MOD_TOTP_SECRET }}
        # The activation gate only arms when the secret is provided.
        run: |
          set -o pipefail
          args=()
          if [ -n "$MOD_TOTP_SECRET" ]; then
            args+=(--dart-define=MOD_TOTP_SECRET="$MOD_TOTP_SECRET")
          fi
          flutter build ipa --no-codesign --release "${args[@]}" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## Build output (tail)'
              echo '```'
              tail -n 150 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -Ei 'error:|fatal|failed' build.log | head -15 | while IFS= read -r line; do
              echo "::error::$(echo "$line" | cut -c1-160)"
            done || true
            exit "$status"
          fi

      - name: Pack archive into unsigned IPA
        working-directory: .
        run: |
          mkdir -p output/Payload
          cp -R OneXray/build/ios/archive/Runner.xcarchive/Products/Applications/*.app output/Payload/
          cd output
          zip -qry OneXray-ios-unsigned.ipa Payload
          cd ..
          ls -lh output

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: onexray-ios-unsigned
          path: output/OneXray-ios-unsigned.ipa
          if-no-files-found: error
